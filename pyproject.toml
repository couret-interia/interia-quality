[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interia-quality"
version = "4.0.0"
description = "InterIA Quality Pack v4 – modular quality engine, refactor assist, AI bridge, cosmos & multiverse analysis."
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Alexandre Couret" },
  { name = "Thomas Ingles" },
  { name = "InterIA" }
]

dependencies = [
  "pyyaml>=6.0",
]

keywords = [
  "InterIA",
  "quality",
  "LaTeX",
  "BibTeX",
  "cosmos-map",
  "multiverse",
  "AI",
  "refactor",
  "AI-assisted refactoring"
]

[project.urls]
Homepage      = "https://couret-interia.fr"
Repository    = "https://github.com/couret-interia/interia-quality"
Issues        = "https://github.com/couret-interia/interia-quality/issues"
Documentation = "https://github.com/couret-interia/interia-quality/tree/main/docs"

[project.scripts]
interia-quality = "interia_quality.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where   = ["."]
include = ["interia_quality*"]

# Add HTML/CSS/JS of board in wheel
[tool.setuptools.package-data]
"interia_quality" = [
  "board/*.html",
  "board/js/*.js",
  "board/themes/*.css",
  "board/docs/**/*"
]
